name: boundary-guard

# Fails the build if cloud-control (open, AGPL) ever imports the closed
# qontinui-coord service source. cloud-control may call coord over its network
# API, but must never import its source. See scripts/check_no_coord_import.py.

on:
  pull_request:
  # merge-candidate*/**: coord's merge train runs CI on the rebased candidate
  # ref before landing it; see the matching comment in ci.yml.
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

jobs:
  no-coord-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cloud-control must not import qontinui-coord source
        run: python3 scripts/check_no_coord_import.py
