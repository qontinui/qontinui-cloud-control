[project]
name = "qontinui-cloud-control"
version = "0.1.0"
description = "Cloud extension to qontinui-web that powers the qontinui.cloud deployment (billing, multi-tenant routing, cloud-admin)."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Joshua Spinak", email = "jspinak@hotmail.com"},
]
dependencies = [
  # qontinui-web is consumed as an editable sibling install:
  #   pip install -e ../qontinui-web/backend
  # before installing this package. We do NOT list qontinui-web here as a
  # path-dep so the dependency is explicit at install time and the file://
  # URL doesn't bake in absolute paths.
  "stripe>=8",
  "boto3>=1.34",
]

[project.optional-dependencies]
# The gate tooling, pinned to the same majors qontinui-web's backend CI uses, so
# a contributor reproduces CI's verdict with `pip install -e .[dev]`.
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["qontinui_cloud_control*"]

# --- Gate configuration -----------------------------------------------------
#
# Deliberately mirrors qontinui-web/backend/pyproject.toml rather than inventing
# a second house style: this package is a carve-out of that tree, its modules
# import `app.*` throughout, and the two are linted as one codebase in the
# composed deployment. Divergence here would show up as churn every time code
# moves across the boundary.

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "E203",  # whitespace before ':'
    "B008",  # function call in default argument — required by FastAPI Depends()
    "B904",  # raise ... from — not retrofitted across existing handlers
]

[tool.mypy]
python_version = "3.12"
# The ONE deliberate divergence from qontinui-web's config, and it is a
# consequence of this gate running standalone. `warn_return_any` is only sound
# when every import resolves; here three boundaries this repo does not own leak
# `Any` into otherwise-correct returns:
#   * `app.*` (qontinui-web) is absent by design — see `ignore_missing_imports`;
#   * typeshed types `Enum.value` as `Any`, hitting every `SubscriptionTier` read;
#   * the Stripe SDK returns `Any` from its resource accessors.
# All 17 reports were of that shape and none was a defect. Silencing them with
# `cast()` would assert a type nobody checked — strictly worse than not asking
# the question, since a cast is unverified at runtime AND hides real drift later.
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
strict_equality = true
# `app.*` (qontinui-web) is an editable sibling install, absent on a bare
# checkout. Ignoring missing imports is what lets this gate run standalone —
# and standalone is what keeps the local-CI lane able to mirror it without
# sibling provisioning.
ignore_missing_imports = true
warn_unreachable = false
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]
